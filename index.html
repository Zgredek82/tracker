<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trener Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" href="https://via.placeholder.com/150/3b82f6/ffffff?text=Tracker">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_GOALS = { calories: 2050, protein: 155, fats: 140, carbs: 40 };

    function NutritionTracker() {
      const [goals, setGoals] = useState(DEFAULT_GOALS);
      const [logs, setLogs] = useState([]);
      const [activeTab, setActiveTab] = useState('dzisiaj');
      const [pasteInput, setPasteInput] = useState('');
      const [manualEntry, setManualEntry] = useState({ time: '', name: '', kcal: '', protein: '', fats: '', carbs: '' });
      const [showBackupAlert, setShowBackupAlert] = useState(false);

      const getTodayString = () => new Date().toISOString().split('T')[0];
      const [selectedDate, setSelectedDate] = useState(getTodayString());

      useEffect(() => {
        const savedLogs = localStorage.getItem('nutrition_logs');
        const savedGoals = localStorage.getItem('nutrition_goals');
        if (savedLogs) setLogs(JSON.parse(savedLogs));
        if (savedGoals) setGoals(JSON.parse(savedGoals));

        // Sprawdzenie przypomnienia o backupie raz dziennie
        const lastBackupDate = localStorage.getItem('last_backup_reminder');
        const today = getTodayString();
        if (lastBackupDate !== today) {
          setShowBackupAlert(true);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('nutrition_logs', JSON.stringify(logs));
        localStorage.setItem('nutrition_goals', JSON.stringify(goals));
      }, [logs, goals]);

      const handlePasteSubmit = (e) => {
        e.preventDefault();
        const regex = /DZIENNIK\s*\|\s*([\d-]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*B\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*T\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*W\s*(\d+(?:\.\d+)?)/i;
        const match = pasteInput.match(regex);
        
        if (match) {
          const [, date, meal, name, kcal, p, f, c] = match;
          addLog({
            id: Date.now(),
            date: date.trim(),
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            meal: meal.trim(),
            name: name.trim(),
            kcal: Math.round(parseFloat(kcal)),
            protein: Math.round(parseFloat(p)),
            fats: Math.round(parseFloat(f)),
            carbs: Math.round(parseFloat(c))
          });
          setPasteInput('');
          setSelectedDate(date.trim());
        } else {
          alert("Nie rozpoznano formatu. Upewnij się, że wklejasz poprawną linię DZIENNIK.");
        }
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        addLog({
          id: Date.now(),
          date: selectedDate,
          time: manualEntry.time || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          meal: 'posiłek',
          name: manualEntry.name || 'Wpis ręczny',
          kcal: parseInt(manualEntry.kcal) || 0,
          protein: parseInt(manualEntry.protein) || 0,
          fats: parseInt(manualEntry.fats) || 0,
          carbs: parseInt(manualEntry.carbs) || 0
        });
        setManualEntry({ time: '', name: '', kcal: '', protein: '', fats: '', carbs: '' });
      };

      const addLog = (newLog) => setLogs((prev) => [...prev, newLog]);
      const deleteLog = (id) => setLogs((prev) => prev.filter(log => log.id !== id));

      const exportBackup = () => {
        const data = { goals, logs };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trener_backup_${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);

        // Oznaczenie, że dzisiaj zrobiono backup
        localStorage.setItem('last_backup_reminder', getTodayString());
        setShowBackupAlert(false);
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.goals) setGoals(data.goals);
            if (data.logs) setLogs(data.logs);
            alert("Backup został pomyślnie wgrany!");
          } catch (err) {
            alert("Błąd odczytu pliku JSON.");
          }
        };
        reader.readAsText(file);
      };

      const todaysLogs = logs.filter(log => log.date === selectedDate);
      const totals = todaysLogs.reduce((acc, log) => ({
        kcal: acc.kcal + log.kcal,
        protein: acc.protein + log.protein,
        fats: acc.fats + log.fats,
        carbs: acc.carbs + log.carbs
      }), { kcal: 0, protein: 0, fats: 0, carbs: 0 });

      const ProgressRing = ({ label, value, max, color }) => {
        const radius = 35, stroke = 6, normalizedRadius = radius - stroke * 2;
        const circumference = normalizedRadius * 2 * Math.PI;
        const strokeDashoffset = circumference - (Math.min(value / max, 1)) * circumference;

        return (
          <div className="flex flex-col items-center">
            <svg height={radius * 2} width={radius * 2} className="transform -rotate-90">
              <circle stroke="#e5e7eb" fill="transparent" strokeWidth={stroke} r={normalizedRadius} cx={radius} cy={radius} />
              <circle stroke={color} fill="transparent" strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 0.5s ease-in-out' }} r={normalizedRadius} cx={radius} cy={radius} />
            </svg>
            <div className="text-center mt-1">
              <p className="text-xs font-bold text-gray-700">{label}</p>
              <p className="text-xs text-gray-500">{value} / {max}g</p>
            </div>
          </div>
        );
      };

      const getLast7Days = () => {
        const dates = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i); dates.push(d.toISOString().split('T')[0]);
        }
        return dates;
      };

      return (
        <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-20 font-sans shadow-lg">
          <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
            <h1 className="text-xl font-bold text-center mb-4">Trener Tracker</h1>
            <div className="flex justify-between rounded-lg bg-blue-700 p-1">
              {['dzisiaj', 'historia', 'ustawienia'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-1 text-sm font-medium rounded-md capitalize ${activeTab === tab ? 'bg-white text-blue-700' : 'text-white'}`}>
                  {tab}
                </button>
              ))}
            </div>
          </header>

          <main className="p-4">
            {/* Alert przypominający o backupie */}
            {showBackupAlert && (
              <div className="bg-amber-50 border-l-4 border-amber-500 p-3 mb-4 rounded shadow-sm flex justify-between items-center">
                <div className="text-xs text-amber-800">
                  <span className="font-bold block">Dzisiejsza kopia zapasowa</span>
                  Zrób backup danych w ustawieniach, aby nic nie stracić.
                </div>
                <button onClick={() => setActiveTab('ustawienia')} className="bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold whitespace-nowrap ml-2">
                  Przejdź
                </button>
              </div>
            )}

            {activeTab === 'dzisiaj' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                  <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() - 1); setSelectedDate(d.toISOString().split('T')[0]); }} className="px-3 py-1 bg-gray-200 rounded text-gray-700 font-bold">&lt;</button>
                  <span className="font-semibold text-gray-700">{selectedDate === getTodayString() ? 'Dzisiaj' : selectedDate}</span>
                  <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() + 1); setSelectedDate(d.toISOString().split('T')[0]); }} className="px-3 py-1 bg-gray-200 rounded text-gray-700 font-bold">&gt;</button>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm text-center">
                  <h2 className="text-sm font-bold text-gray-500 uppercase">Kalorie</h2>
                  <div className="text-3xl font-extrabold text-blue-600 my-2">{totals.kcal} <span className="text-lg text-gray-400">/ {goals.calories}</span></div>
                  <p className="text-sm text-gray-500">Zostało: <span className="font-bold">{goals.calories - totals.kcal > 0 ? goals.calories - totals.kcal : 0} kcal</span></p>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm flex justify-around">
                  <ProgressRing label="Białko" value={totals.protein} max={goals.protein} color="#3b82f6" />
                  <ProgressRing label="Tłuszcze" value={totals.fats} max={goals.fats} color="#eab308" />
                  <ProgressRing label="Węgle" value={totals.carbs} max={goals.carbs} color="#ef4444" />
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm space-y-4">
                  <h3 className="font-bold text-gray-700 text-sm">Dodaj posiłek</h3>
                  <form onSubmit={handlePasteSubmit} className="flex gap-2">
                    <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center bg-purple-100 text-purple-700 text-xl rounded px-3 border border-purple-200" title="Zrób zdjęcie w Gemini">
                      📸
                    </a>
                    <input type="text" value={pasteInput} onChange={(e) => setPasteInput(e.target.value)} placeholder="Wklej linię z czatu" className="flex-1 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500" />
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">Zapisz</button>
                  </form>
                  <details className="text-sm">
                    <summary className="text-blue-500 font-semibold cursor-pointer py-2">Ręczne wprowadzanie</summary>
                    <form onSubmit={handleManualSubmit} className="mt-3 space-y-2 flex flex-wrap gap-2 bg-gray-50 p-3 rounded">
                      <input type="text" placeholder="Nazwa dania" className="w-full border p-2 rounded" value={manualEntry.name} onChange={e => setManualEntry({...manualEntry, name: e.target.value})} required/>
                      <input type="number" placeholder="Kcal" className="flex-1 border p-2 rounded" value={manualEntry.kcal} onChange={e => setManualEntry({...manualEntry, kcal: e.target.value})} required/>
                      <input type="number" placeholder="B (g)" className="w-16 border p-2 rounded" value={manualEntry.protein} onChange={e => setManualEntry({...manualEntry, protein: e.target.value})}/>
                      <input type="number" placeholder="T (g)" className="w-16 border p-2 rounded" value={manualEntry.fats} onChange={e => setManualEntry({...manualEntry, fats: e.target.value})}/>
                      <input type="number" placeholder="W (g)" className="w-16 border p-2 rounded" value={manualEntry.carbs} onChange={e => setManualEntry({...manualEntry, carbs: e.target.value})}/>
                      <button type="submit" className="w-full bg-green-500 text-white p-2 rounded font-bold">Dodaj</button>
                    </form>
                  </details>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700 text-sm">Zjedzone dzisiaj</h3>
                  {todaysLogs.length === 0 ? <p className="text-gray-400 text-sm text-center py-4">Brak wpisów. Smacznego!</p> : todaysLogs.map(log => (
                    <div key={log.id} className="flex justify-between items-center border-b pb-2">
                      <div>
                        <p className="font-semibold text-sm text-gray-800">{log.name} <span className="text-xs text-gray-400 font-normal">({log.time})</span></p>
                        <p className="text-xs text-gray-500">{log.kcal} kcal | B: {log.protein}g | T: {log.fats}g | W: {log.carbs}g</p>
                      </div>
                      <button onClick={() => deleteLog(log.id)} className="text-red-500 text-xl font-bold px-2">&times;</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'historia' && (
              <div className="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 className="font-bold text-gray-700">Ostatnie 7 dni</h3>
                <div className="flex items-end justify-between h-48 border-b border-l pb-2 pl-2 relative mt-8">
                  <div className="absolute w-full border-t-2 border-dashed border-red-400 left-0" style={{ bottom: `${Math.min((goals.calories / 3500) * 100, 100)}%` }}>
                    <span className="absolute -top-5 right-0 text-xs text-red-500 font-bold">Cel: {goals.calories}</span>
                  </div>
                  {getLast7Days().map(date => {
                    const dayKcal = logs.filter(l => l.date === date).reduce((acc, l) => acc + l.kcal, 0);
                    return (
                      <div key={date} className="flex flex-col items-center w-1/7">
                        <div className="text-xs text-gray-500 mb-1">{dayKcal}</div>
                        <div className={`w-8 rounded-t-sm ${dayKcal > goals.calories ? 'bg-red-400' : 'bg-blue-500'}`} style={{ height: `${Math.min((dayKcal / 3500) * 100, 100)}%`, minHeight: dayKcal > 0 ? '10px' : '0' }}></div>
                        <div className="text-xs text-gray-600 mt-2 capitalize">{new Date(date).toLocaleDateString('pl-PL', { weekday: 'short' })}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'ustawienia' && (
              <div className="bg-white p-5 rounded-xl shadow-sm space-y-6">
                <div>
                  <h3 className="font-bold text-gray-700 mb-3">Moje Cele</h3>
                  <div className="space-y-3">
                    {Object.entries({calories: 'Kalorie (kcal)', protein: 'Białko (g)', fats: 'Tłuszcze (g)', carbs: 'Węglowodany (g)'}).map(([key, label]) => (
                      <div key={key}>
                        <label className="block text-sm text-gray-600">{label}</label>
                        <input type="number" value={goals[key]} onChange={e => setGoals({...goals, [key]: Number(e.target.value)})} className="border p-2 rounded w-full"/>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t pt-4 space-y-3">
                  <h3 className="font-bold text-gray-700">Kopia zapasowa (Backup)</h3>
                  <div className="flex gap-2">
                    <button onClick={exportBackup} className="flex-1 bg-purple-600 text-white p-2 rounded text-sm font-bold">Eksportuj backup</button>
                    <label className="flex-1 bg-gray-200 text-gray-700 p-2 rounded text-sm font-bold text-center cursor-pointer">
                      Importuj backup
                      <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NutritionTracker />);
  </script>
</body>
</html>
