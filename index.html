<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Osobisty dziennik żywienia, postępów, nawodnienia i treningów.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trener Tracker">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>Trener Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_GOALS = { calories: 2050, protein: 155, fats: 140, carbs: 40 };

    function NutritionTracker() {
      const [goals, setGoals] = useState(DEFAULT_GOALS);
      const [logs, setLogs] = useState([]);
      const [activeTab, setActiveTab] = useState('dzisiaj');
      const [pasteInput, setPasteInput] = useState('');
      const [manualEntry, setManualEntry] = useState({ time: '', name: '', kcal: '', protein: '', fats: '', carbs: '' });
      const [showBackupAlert, setShowBackupAlert] = useState(false);
      const [coffeeCount, setCoffeeCount] = useState(0);
      const [profile, setProfile] = useState({ age: 44, sex: 'male', height: 173, weight: 78, activity: 1.45 });
      const [weightEntries, setWeightEntries] = useState([]);
      const [waistEntries, setWaistEntries] = useState([]);
      const [waterEntries, setWaterEntries] = useState([]);
      const [workouts, setWorkouts] = useState([]);
      const [dietMode, setDietMode] = useState('keto');
      const [goalsByDiet, setGoalsByDiet] = useState({
        keto: { calories: 2050, protein: 155, fats: 140, carbs: 40 },
        normal: { calories: 2050, protein: 155, fats: 70, carbs: 220 }
      });
      const [weightInput, setWeightInput] = useState('');
      const [editingWeightId, setEditingWeightId] = useState(null);
      const [editingWeightValue, setEditingWeightValue] = useState('');
      const [editingWeightDate, setEditingWeightDate] = useState('');
      const [waistInput, setWaistInput] = useState('');
      const [waterInput, setWaterInput] = useState('250');
      const [workoutInput, setWorkoutInput] = useState({ type: 'Siłownia', duration: 45, notes: '' });


      const getTodayString = () => new Date().toISOString().split('T')[0];
      const [selectedDate, setSelectedDate] = useState(getTodayString());

      useEffect(() => {
        const savedLogs = localStorage.getItem('nutrition_logs');
        const savedGoals = localStorage.getItem('nutrition_goals');
        const savedCoffee = localStorage.getItem('coffee_count');
        const savedCoffeeDate = localStorage.getItem('coffee_date');
        
        if (savedLogs) setLogs(JSON.parse(savedLogs));
        if (savedGoals) setGoals(JSON.parse(savedGoals));
        try {
          const p = localStorage.getItem('tracker_profile'); if (p) setProfile(prev => ({ ...prev, ...JSON.parse(p) }));
          const w = localStorage.getItem('tracker_weights'); if (w) setWeightEntries(JSON.parse(w));
          const wa = localStorage.getItem('tracker_waist'); if (wa) setWaistEntries(JSON.parse(wa));
          const water = localStorage.getItem('tracker_water'); if (water) setWaterEntries(JSON.parse(water));
          const wo = localStorage.getItem('tracker_workouts'); if (wo) setWorkouts(JSON.parse(wo));
          const mode = localStorage.getItem('tracker_diet_mode'); if (mode) setDietMode(mode);
          const gb = localStorage.getItem('tracker_goals_by_diet'); if (gb) setGoalsByDiet(prev => ({ ...prev, ...JSON.parse(gb) }));
        } catch (e) { console.warn('Nie udało się odczytać dodatkowych danych profilu.', e); }


        const today = getTodayString();
        if (savedCoffeeDate === today && savedCoffee) {
          setCoffeeCount(JSON.parse(savedCoffee));
        } else {
          setCoffeeCount(0);
          localStorage.setItem('coffee_date', today);
        }

        const lastBackupDate = localStorage.getItem('last_backup_reminder');
        if (lastBackupDate !== today) {
          setShowBackupAlert(true);
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('nutrition_logs', JSON.stringify(logs));
        localStorage.setItem('nutrition_goals', JSON.stringify(goals));
        localStorage.setItem('tracker_profile', JSON.stringify(profile));
        localStorage.setItem('tracker_weights', JSON.stringify(weightEntries));
        localStorage.setItem('tracker_waist', JSON.stringify(waistEntries));
        localStorage.setItem('tracker_water', JSON.stringify(waterEntries));
        localStorage.setItem('tracker_workouts', JSON.stringify(workouts));
        localStorage.setItem('tracker_diet_mode', dietMode);
        localStorage.setItem('tracker_goals_by_diet', JSON.stringify(goalsByDiet));

      }, [logs, goals, profile, weightEntries, waistEntries, waterEntries, workouts, dietMode, goalsByDiet]);

      useEffect(() => {
        localStorage.setItem('coffee_count', JSON.stringify(coffeeCount));
        localStorage.setItem('coffee_date', getTodayString());
      }, [coffeeCount]);

      // Unikalne nazwy potraw z historii do autouzupełniania
      const uniqueMealNames = useMemo(() => {
        const names = logs.map(l => l.name);
        return [...new Set(names)].filter(Boolean);
      }, [logs]);

      // Obsługa automatycznego uzupełniania makro po wybraniu z historii
      const handleNameChange = (e) => {
        const nameVal = e.target.value;
        setManualEntry(prev => {
          const matched = logs.slice().reverse().find(l => l.name.toLowerCase() === nameVal.toLowerCase());
          if (matched) {
            return {
              ...prev,
              name: nameVal,
              kcal: matched.kcal,
              protein: matched.protein,
              fats: matched.fats,
              carbs: matched.carbs
            };
          }
          return { ...prev, name: nameVal };
        });
      };

      const handlePasteSubmit = (e) => {
        e.preventDefault();
        // Zamiana przecinków na kropki automatycznie
        const sanitizedInput = pasteInput.replace(/,/g, '.');
        const regex = /DZIENNIK\s*\|\s*([\d-]+)\s*\|\s*([^|]+)\s*\|\s*([^|]+)\s*\|\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*B\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*T\s*(\d+(?:\.\d+)?)\s*[a-zA-Z]*\s*\|\s*W\s*(\d+(?:\.\d+)?)/i;
        const match = sanitizedInput.match(regex);
        
        if (match) {
          const [, date, meal, name, kcal, p, f, c] = match;
          addLog({
            id: Date.now(),
            date: date.trim(),
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            meal: meal.trim(),
            name: name.trim(),
            kcal: Math.round(parseFloat(kcal)),
            protein: Math.round(parseFloat(p)),
            fats: Math.round(parseFloat(f)),
            carbs: Math.round(parseFloat(c))
          });
          setPasteInput('');
          setSelectedDate(date.trim());
        } else {
          alert("Nie rozpoznano formatu. Upewnij się, że wklejasz poprawną linię DZIENNIK.");
        }
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        addLog({
          id: Date.now(),
          date: selectedDate,
          time: manualEntry.time || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          meal: 'posiłek',
          name: manualEntry.name || 'Wpis ręczny',
          kcal: parseInt(manualEntry.kcal) || 0,
          protein: parseInt(manualEntry.protein) || 0,
          fats: parseInt(manualEntry.fats) || 0,
          carbs: parseInt(manualEntry.carbs) || 0
        });
        setManualEntry({ time: '', name: '', kcal: '', protein: '', fats: '', carbs: '' });
      };

      const addLog = (newLog) => setLogs((prev) => [...prev, newLog]);
      const deleteLog = (id) => setLogs((prev) => prev.filter(log => log.id !== id));

      const exportBackup = () => {
        const data = { goals, logs, coffeeCount, profile, weightEntries, waistEntries, waterEntries, workouts, dietMode, goalsByDiet };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `trener_backup_${getTodayString()}.json`;
        a.click();
        URL.revokeObjectURL(url);

        localStorage.setItem('last_backup_reminder', getTodayString());
        setShowBackupAlert(false);
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.goals) setGoals(data.goals);
            if (data.logs) setLogs(data.logs);
            if (data.coffeeCount !== undefined) setCoffeeCount(data.coffeeCount);
            if (data.profile) setProfile(data.profile);
            if (data.weightEntries) setWeightEntries(data.weightEntries);
            if (data.waistEntries) setWaistEntries(data.waistEntries);
            if (data.waterEntries) setWaterEntries(data.waterEntries);
            if (data.workouts) setWorkouts(data.workouts);
            if (data.dietMode) setDietMode(data.dietMode);
            if (data.goalsByDiet) setGoalsByDiet(data.goalsByDiet);

            alert("Backup został pomyślnie wgrany!");
          } catch (err) {
            alert("Błąd odczytu pliku JSON.");
          }
        };
        reader.readAsText(file);
      };

      const todaysLogs = logs.filter(log => log.date === selectedDate);
      const totals = todaysLogs.reduce((acc, log) => ({
        kcal: acc.kcal + log.kcal,
        protein: acc.protein + log.protein,
        fats: acc.fats + log.fats,
        carbs: acc.carbs + log.carbs
      }), { kcal: 0, protein: 0, fats: 0, carbs: 0 });


      const bmr = Math.round(10 * Number(profile.weight || 0) + 6.25 * Number(profile.height || 0) - 5 * Number(profile.age || 0) + (profile.sex === 'male' ? 5 : -161));
      const tdee = Math.round(bmr * Number(profile.activity || 1.2));
      const recentDates = getLast7Days();
      const recentLoggedDays = recentDates.map(date => {
        const day = logs.filter(l => l.date === date);
        return day.length ? day.reduce((a, l) => ({ kcal: a.kcal + Number(l.kcal || 0), protein: a.protein + Number(l.protein || 0), fats: a.fats + Number(l.fats || 0), carbs: a.carbs + Number(l.carbs || 0) }), { kcal: 0, protein: 0, fats: 0, carbs: 0 }) : null;
      }).filter(Boolean);
      const weeklyAverage = recentLoggedDays.length ? {
        kcal: Math.round(recentLoggedDays.reduce((a, d) => a + d.kcal, 0) / recentLoggedDays.length),
        protein: Math.round(recentLoggedDays.reduce((a, d) => a + d.protein, 0) / recentLoggedDays.length),
        fats: Math.round(recentLoggedDays.reduce((a, d) => a + d.fats, 0) / recentLoggedDays.length),
        carbs: Math.round(recentLoggedDays.reduce((a, d) => a + d.carbs, 0) / recentLoggedDays.length)
      } : null;
      const todayWater = waterEntries.filter(x => x.date === getTodayString()).reduce((a, x) => a + Number(x.ml || 0), 0);
      const lowCalorieLimit = Math.max(1200, Math.round(bmr * 0.7));
      const completedLowDays = Array.from({ length: 3 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - (i + 1));
        const key = d.toISOString().split('T')[0];
        const day = logs.filter(l => l.date === key);
        return day.length > 0 && day.reduce((a, l) => a + Number(l.kcal || 0), 0) < lowCalorieLimit;
      });
      const lowIntakeWarning = completedLowDays.every(Boolean);
      const addWeight = (e) => {
        e.preventDefault();
        const value = Number(weightInput);
        if (!value || value < 30 || value > 300) return;
        setWeightEntries(prev => [...prev, { id: Date.now(), date: selectedDate, kg: value }].sort((a,b) => a.date.localeCompare(b.date)));
        setProfile(prev => ({ ...prev, weight: value }));
        setWeightInput('');
      };
      const startWeightEdit = (entry) => {
        setEditingWeightId(entry.id);
        setEditingWeightValue(String(entry.kg));
        setEditingWeightDate(entry.date);
      };
      const cancelWeightEdit = () => {
        setEditingWeightId(null);
        setEditingWeightValue('');
        setEditingWeightDate('');
      };
      const syncProfileWeight = (entries) => {
        const latest = [...entries].sort((a, b) => a.date.localeCompare(b.date)).at(-1);
        if (latest) setProfile(prev => ({ ...prev, weight: Number(latest.kg) }));
      };
      const saveWeightEdit = (e) => {
        e.preventDefault();
        const value = Number(editingWeightValue);
        if (!value || value < 30 || value > 300 || !editingWeightDate) return;
        const updated = weightEntries.map(entry => entry.id === editingWeightId
          ? { ...entry, kg: value, date: editingWeightDate }
          : entry
        ).sort((a, b) => a.date.localeCompare(b.date));
        setWeightEntries(updated);
        syncProfileWeight(updated);
        cancelWeightEdit();
      };
      const deleteWeight = (id) => {
        if (!window.confirm('Usunąć ten pomiar masy ciała?')) return;
        const updated = weightEntries.filter(entry => entry.id !== id);
        setWeightEntries(updated);
        syncProfileWeight(updated);
      };
      const addWaist = (e) => {
        e.preventDefault();
        const value = Number(waistInput);
        if (!value || value < 30 || value > 200) return;
        setWaistEntries(prev => [...prev, { id: Date.now(), date: selectedDate, cm: value }].sort((a,b) => a.date.localeCompare(b.date)));
        setWaistInput('');
      };
      const addWater = (e) => {
        e.preventDefault();
        const value = Number(waterInput);
        if (!value || value < 1 || value > 5000) return;
        setWaterEntries(prev => [...prev, { id: Date.now(), date: selectedDate, ml: value }]);
        setWaterInput('250');
      };
      const addWorkout = (e) => {
        e.preventDefault();
        setWorkouts(prev => [...prev, { id: Date.now(), date: selectedDate, ...workoutInput }]);
        setWorkoutInput({ type: 'Siłownia', duration: 45, notes: '' });
      };
      const switchDiet = (mode) => {
        setGoalsByDiet(prev => ({ ...prev, [dietMode]: goals }));
        setDietMode(mode);
        setGoals(goalsByDiet[mode] || (mode === 'keto' ? DEFAULT_GOALS : { calories: 2050, protein: 155, fats: 70, carbs: 220 }));
      };

      const ProgressRing = ({ label, value, max, color }) => {
        const radius = 35, stroke = 6, normalizedRadius = radius - stroke * 2;
        const circumference = normalizedRadius * 2 * Math.PI;
        const strokeDashoffset = circumference - (Math.min(value / max, 1)) * circumference;

        return (
          <div className="flex flex-col items-center">
            <svg height={radius * 2} width={radius * 2} className="transform -rotate-90">
              <circle stroke="#e5e7eb" fill="transparent" strokeWidth={stroke} r={normalizedRadius} cx={radius} cy={radius} />
              <circle stroke={color} fill="transparent" strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 0.5s ease-in-out' }} r={normalizedRadius} cx={radius} cy={radius} />
            </svg>
            <div className="text-center mt-1">
              <p className="text-xs font-bold text-gray-700">{label}</p>
              <p className="text-xs text-gray-500">{value} / {max}g</p>
            </div>
          </div>
        );
      };

      function getLast7Days() {
        const dates = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i); dates.push(d.toISOString().split('T')[0]);
        }
        return dates;
      }

      const toggleCoffee = (index) => {
        if (coffeeCount === index + 1) {
          setCoffeeCount(index);
        } else {
          setCoffeeCount(index + 1);
        }
      };

      return (
        <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-20 font-sans shadow-lg">
          <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
            <h1 className="text-xl font-bold text-center mb-4">Trener Tracker</h1>
            <div className="flex justify-between rounded-lg bg-blue-700 p-1">
              {['dzisiaj', 'historia', 'postępy', 'aktywność', 'ustawienia'].map(tab => (
                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-1 text-sm font-medium rounded-md capitalize ${activeTab === tab ? 'bg-white text-blue-700' : 'text-white'}`}>
                  {tab}
                </button>
              ))}
            </div>
          </header>

          <main className="p-4">
            {showBackupAlert && (
              <div className="bg-amber-50 border-l-4 border-amber-500 p-3 mb-4 rounded shadow-sm flex justify-between items-center">
                <div className="text-xs text-amber-800">
                  <span className="font-bold block">Dzisiejsza kopia zapasowa</span>
                  Zrób backup danych w ustawieniach, aby nic nie stracić.
                </div>
                <button onClick={() => setActiveTab('ustawienia')} className="bg-amber-500 text-white px-3 py-1 rounded text-xs font-bold whitespace-nowrap ml-2">
                  Przejdź
                </button>
              </div>
            )}

            {activeTab === 'dzisiaj' && (
              <div className="space-y-6">
                {lowIntakeWarning && <div className="bg-amber-50 border border-amber-300 text-amber-900 p-3 rounded-xl text-sm"><b>Uwaga: niska podaż energii</b><p>W każdym z ostatnich 3 dni z zapisanymi posiłkami odnotowano mniej niż {lowCalorieLimit} kcal. Sprawdź, czy dzienniki są kompletne. To orientacyjny sygnał, nie diagnoza ani zalecenie żywieniowe.</p></div>}
                <div className="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm">
                  <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() - 1); setSelectedDate(d.toISOString().split('T')[0]); }} className="px-3 py-1 bg-gray-200 rounded text-gray-700 font-bold">&lt;</button>
                  <span className="font-semibold text-gray-700">{selectedDate === getTodayString() ? 'Dzisiaj' : selectedDate}</span>
                  <button onClick={() => { const d = new Date(selectedDate); d.setDate(d.getDate() + 1); setSelectedDate(d.toISOString().split('T')[0]); }} className="px-3 py-1 bg-gray-200 rounded text-gray-700 font-bold">&gt;</button>
                </div>

                {/* Checklista Kawy */}
                <div className="bg-white p-4 rounded-xl shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className="font-bold text-gray-700 text-sm">☕ Dzienny limit kawy ({coffeeCount}/5)</h3>
                    <button onClick={() => setCoffeeCount(0)} className="text-xs text-gray-400 hover:text-red-500">Reset</button>
                  </div>
                  <div className="flex justify-between gap-1">
                    {[0, 1, 2, 3, 4].map((i) => (
                      <button
                        key={i}
                        onClick={() => toggleCoffee(i)}
                        className={`flex-1 py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition-all ${
                          i < coffeeCount ? 'bg-amber-700 text-white shadow' : 'bg-gray-100 text-gray-400 border border-gray-200'
                        }`}
                      >
                        <span>☕</span>
                        <span>{i + 1}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm text-center">
                  <h2 className="text-sm font-bold text-gray-500 uppercase">Kalorie</h2>
                  <div className="text-3xl font-extrabold text-blue-600 my-2">{totals.kcal} <span className="text-lg text-gray-400">/ {goals.calories}</span></div>
                  <p className="text-sm text-gray-500">Zostało: <span className="font-bold">{goals.calories - totals.kcal > 0 ? goals.calories - totals.kcal : 0} kcal</span></p>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm flex justify-around">
                  <ProgressRing label="Białko" value={totals.protein} max={goals.protein} color="#3b82f6" />
                  <ProgressRing label="Tłuszcze" value={totals.fats} max={goals.fats} color="#eab308" />
                  <ProgressRing label="Węgle" value={totals.carbs} max={goals.carbs} color="#ef4444" />
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm space-y-4">
                  <h3 className="font-bold text-gray-700 text-sm">Dodaj posiłek</h3>
                  <form onSubmit={handlePasteSubmit} className="flex gap-2">
                    <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center bg-purple-100 text-purple-700 text-xl rounded px-3 border border-purple-200" title="Zrób zdjęcie w Gemini">
                      📸
                    </a>
                    <input type="text" value={pasteInput} onChange={(e) => setPasteInput(e.target.value)} placeholder="Wklej linię z czatu" className="flex-1 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500" />
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">Zapisz</button>
                  </form>

                  <details className="text-sm" open>
                    <summary className="text-blue-500 font-semibold cursor-pointer py-2">Ręczne wprowadzanie / Pamięć posiłków</summary>
                    <form onSubmit={handleManualSubmit} className="mt-3 space-y-2 flex flex-wrap gap-2 bg-gray-50 p-3 rounded">
                      <div className="w-full relative">
                        <input 
                          type="text" 
                          list="history-meals"
                          placeholder="Zacznij pisać nazwę posiłku..." 
                          className="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" 
                          value={manualEntry.name} 
                          onChange={handleNameChange} 
                          required
                        />
                        <datalist id="history-meals">
                          {uniqueMealNames.map((name, idx) => (
                            <option key={idx} value={name} />
                          ))}
                        </datalist>
                      </div>
                      
                      <div className="flex gap-2 w-full">
                        <input type="number" placeholder="Kcal" className="flex-1 border p-2 rounded" value={manualEntry.kcal} onChange={e => setManualEntry({...manualEntry, kcal: e.target.value})} required/>
                        <input type="number" placeholder="B (g)" className="w-20 border p-2 rounded" value={manualEntry.protein} onChange={e => setManualEntry({...manualEntry, protein: e.target.value})}/>
                        <input type="number" placeholder="T (g)" className="w-20 border p-2 rounded" value={manualEntry.fats} onChange={e => setManualEntry({...manualEntry, fats: e.target.value})}/>
                        <input type="number" placeholder="W (g)" className="w-20 border p-2 rounded" value={manualEntry.carbs} onChange={e => setManualEntry({...manualEntry, carbs: e.target.value})}/>
                      </div>

                      <button type="submit" className="w-full bg-green-500 text-white p-2 rounded font-bold">Dodaj do dziennika</button>
                    </form>
                  </details>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700 text-sm">Zjedzone dzisiaj</h3>
                  {todaysLogs.length === 0 ? <p className="text-gray-400 text-sm text-center py-4">Brak wpisów. Smacznego!</p> : todaysLogs.map(log => (
                    <div key={log.id} className="flex justify-between items-center border-b pb-2">
                      <div>
                        <p className="font-semibold text-sm text-gray-800">{log.name} <span className="text-xs text-gray-400 font-normal">({log.time})</span></p>
                        <p className="text-xs text-gray-500">{log.kcal} kcal | B: {log.protein}g | T: {log.fats}g | W: {log.carbs}g</p>
                      </div>
                      <button onClick={() => deleteLog(log.id)} className="text-red-500 text-xl font-bold px-2">&times;</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'historia' && (
              <div className="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h3 className="font-bold text-gray-700">Ostatnie 7 dni</h3>
                <div className="flex items-end justify-between h-48 border-b border-l pb-2 pl-2 relative mt-8">
                  <div className="absolute w-full border-t-2 border-dashed border-red-400 left-0" style={{ bottom: `${Math.min((goals.calories / 3500) * 100, 100)}%` }}>
                    <span className="absolute -top-5 right-0 text-xs text-red-500 font-bold">Cel: {goals.calories}</span>
                  </div>
                  {getLast7Days().map(date => {
                    const dayKcal = logs.filter(l => l.date === date).reduce((acc, l) => acc + l.kcal, 0);
                    return (
                      <div key={date} className="flex flex-col items-center w-1/7">
                        <div className="text-xs text-gray-500 mb-1">{dayKcal}</div>
                        <div className={`w-8 rounded-t-sm ${dayKcal > goals.calories ? 'bg-red-400' : 'bg-blue-500'}`} style={{ height: `${Math.min((dayKcal / 3500) * 100, 100)}%`, minHeight: dayKcal > 0 ? '10px' : '0' }}></div>
                        <div className="text-xs text-gray-600 mt-2 capitalize">{new Date(date).toLocaleDateString('pl-PL', { weekday: 'short' })}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}


            {activeTab === 'postępy' && (
              <div className="space-y-4">
                <section className="bg-white p-4 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700">Masa ciała</h3>
                  <form onSubmit={addWeight} className="flex gap-2">
                    <input type="number" step="0.1" min="30" max="300" value={weightInput} onChange={e => setWeightInput(e.target.value)} placeholder="Waga (kg)" className="flex-1 min-w-0 border p-2 rounded" required />
                    <button className="bg-blue-600 text-white px-4 rounded font-bold">Dodaj</button>
                  </form>
                  {weightEntries.length > 0 && (() => {
                    const ordered = [...weightEntries].sort((a, b) => a.date.localeCompare(b.date));
                    const first = ordered[0], latest = ordered[ordered.length - 1];
                    const change = Number((latest.kg - first.kg).toFixed(1));
                    return <div className="grid grid-cols-2 gap-2">
                      <div className="bg-gray-50 rounded-lg p-3">
                        <div className="text-xs text-gray-500">Ostatni pomiar</div>
                        <div className="text-xl font-bold text-gray-800">{Number(latest.kg).toFixed(1)} kg</div>
                        <div className="text-xs text-gray-500">{latest.date}</div>
                      </div>
                      <div className="bg-gray-50 rounded-lg p-3">
                        <div className="text-xs text-gray-500">Zmiana od pierwszego</div>
                        <div className={`text-xl font-bold ${change < 0 ? 'text-green-700' : change > 0 ? 'text-orange-600' : 'text-gray-800'}`}>
                          {change > 0 ? '+' : ''}{change.toFixed(1)} kg
                        </div>
                        <div className="text-xs text-gray-500">Pierwszy: {Number(first.kg).toFixed(1)} kg</div>
                      </div>
                    </div>;
                  })()}
                  {weightEntries.length > 1 ? (
                    <div className="h-44">
                      <svg viewBox="0 0 320 150" className="w-full h-full" role="img" aria-label="Wykres historii masy ciała">
                        <polyline fill="none" stroke="#2563eb" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={weightEntries.map((x,i) => {
                          const min = Math.min(...weightEntries.map(v => v.kg)) - 1, max = Math.max(...weightEntries.map(v => v.kg)) + 1;
                          return `${weightEntries.length === 1 ? 160 : 12 + i * (296 / (weightEntries.length - 1))},${138 - ((x.kg - min) / Math.max(max-min, 1)) * 118}`;
                        }).join(' ')} />
                        {weightEntries.map((x,i) => <circle key={x.id} cx={weightEntries.length === 1 ? 160 : 12 + i * (296 / (weightEntries.length - 1))} cy={(() => { const min = Math.min(...weightEntries.map(v => v.kg))-1, max = Math.max(...weightEntries.map(v => v.kg))+1; return 138-((x.kg-min)/Math.max(max-min,1))*118; })()} r="3" fill="#2563eb" />)}
                      </svg>
                    </div>
                  ) : <p className="text-sm text-gray-500">Dodaj co najmniej dwa pomiary, aby zobaczyć wykres.</p>}
                  <div className="space-y-2">
                    <div className="text-xs font-semibold text-gray-500">Historia pomiarów</div>
                    {[...weightEntries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8).map(x => (
                      <div key={x.id} className="border-b pb-2 text-sm">
                        {editingWeightId === x.id ? (
                          <form onSubmit={saveWeightEdit} className="space-y-2">
                            <div className="grid grid-cols-2 gap-2">
                              <label className="text-xs text-gray-500">Data
                                <input type="date" value={editingWeightDate} onChange={e => setEditingWeightDate(e.target.value)} className="mt-1 w-full border rounded p-2 text-sm text-gray-800" required />
                              </label>
                              <label className="text-xs text-gray-500">Waga (kg)
                                <input type="number" min="30" max="300" step="0.1" value={editingWeightValue} onChange={e => setEditingWeightValue(e.target.value)} className="mt-1 w-full border rounded p-2 text-sm text-gray-800" required />
                              </label>
                            </div>
                            <div className="flex gap-2">
                              <button type="submit" className="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-semibold">Zapisz</button>
                              <button type="button" onClick={cancelWeightEdit} className="bg-gray-100 text-gray-700 px-3 py-1.5 rounded text-xs">Anuluj</button>
                            </div>
                          </form>
                        ) : (
                          <div className="flex items-center justify-between gap-2">
                            <div><span className="text-gray-600">{x.date}</span><div className="font-bold text-gray-800">{Number(x.kg).toFixed(1)} kg</div></div>
                            <div className="flex gap-2 shrink-0">
                              <button type="button" onClick={() => startWeightEdit(x)} className="text-blue-700 bg-blue-50 px-2 py-1 rounded text-xs font-semibold">Edytuj</button>
                              <button type="button" onClick={() => deleteWeight(x.id)} className="text-red-700 bg-red-50 px-2 py-1 rounded text-xs font-semibold">Usuń</button>
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                    {weightEntries.length > 8 && <p className="text-xs text-gray-500">Wyświetlono 8 najnowszych z {weightEntries.length} pomiarów.</p>}
                  </div>
                </section>
                <section className="bg-white p-4 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700">Obwód pasa</h3>
                  <form onSubmit={addWaist} className="flex gap-2">
                    <input type="number" step="0.5" value={waistInput} onChange={e => setWaistInput(e.target.value)} placeholder="Obwód (cm)" className="flex-1 border p-2 rounded" required />
                    <button className="bg-blue-600 text-white px-4 rounded font-bold">Dodaj</button>
                  </form>
                  {waistEntries.slice(-8).reverse().map(x => <div key={x.id} className="flex justify-between border-b py-1 text-sm"><span>{x.date}</span><b>{x.cm} cm</b></div>)}
                </section>
                <section className="bg-white p-4 rounded-xl shadow-sm space-y-2">
                  <h3 className="font-bold text-gray-700">Średnia z ostatnich 7 dni</h3>
                  <p className="text-xs text-gray-500">Średnia z dni, w których zapisano co najmniej jeden posiłek ({recentLoggedDays.length}/7 dni).</p>
                  {weeklyAverage ? <div className="grid grid-cols-2 gap-3 text-sm">{[['Kalorie', weeklyAverage.kcal + ' kcal'],['Białko', weeklyAverage.protein + ' g'],['Tłuszcze', weeklyAverage.fats + ' g'],['Węglowodany', weeklyAverage.carbs + ' g']].map(([k,v]) => <div key={k} className="bg-gray-50 p-3 rounded"><div className="text-gray-500">{k}</div><b>{v}</b></div>)}</div> : <p className="text-sm text-gray-500">Brak danych z ostatnich 7 dni.</p>}
                </section>
              </div>
            )}

            {activeTab === 'aktywność' && (
              <div className="space-y-4">
                <section className="bg-white p-4 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700">Nawodnienie – {todayWater} ml dzisiaj</h3>
                  <div className="h-3 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-sky-500" style={{width: `${Math.min(todayWater / 2500 * 100, 100)}%`}} /></div>
                  <form onSubmit={addWater} className="flex gap-2">
                    <input type="number" value={waterInput} onChange={e => setWaterInput(e.target.value)} className="flex-1 border p-2 rounded" min="1" max="5000" />
                    <button className="bg-sky-600 text-white px-4 rounded font-bold">Dodaj ml</button>
                  </form>
                  <p className="text-xs text-gray-500">Orientacyjny pasek postępu do 2500 ml; zapotrzebowanie zależy m.in. od temperatury, aktywności i stanu zdrowia.</p>
                </section>
                <section className="bg-white p-4 rounded-xl shadow-sm space-y-3">
                  <h3 className="font-bold text-gray-700">Dziennik treningów</h3>
                  <form onSubmit={addWorkout} className="space-y-2">
                    <select value={workoutInput.type} onChange={e => setWorkoutInput({...workoutInput,type:e.target.value})} className="w-full border p-2 rounded"><option>Siłownia</option><option>Rower</option><option>Spacer</option><option>Bieganie</option><option>Inne</option></select>
                    <input type="number" min="1" max="600" value={workoutInput.duration} onChange={e => setWorkoutInput({...workoutInput,duration:Number(e.target.value)})} className="w-full border p-2 rounded" placeholder="Czas (min)" />
                    <input value={workoutInput.notes} onChange={e => setWorkoutInput({...workoutInput,notes:e.target.value})} className="w-full border p-2 rounded" placeholder="Notatka (opcjonalnie)" />
                    <button className="w-full bg-green-600 text-white p-2 rounded font-bold">Zapisz trening</button>
                  </form>
                  {workouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(x => <div key={x.id} className="border-b py-2 text-sm"><div className="flex justify-between"><b>{x.type}</b><span>{x.date} · {x.duration} min</span></div>{x.notes && <p className="text-gray-500">{x.notes}</p>}</div>)}
                </section>
              </div>
            )}

            {activeTab === 'ustawienia' && (
              <div className="bg-white p-5 rounded-xl shadow-sm space-y-6">
                <div>
                  <h3 className="font-bold text-gray-700 mb-3">Moje Cele</h3>
                  <div className="mb-4">
                    <label className="block text-sm text-gray-600 mb-1">Rodzaj diety</label>
                    <select value={dietMode} onChange={e => switchDiet(e.target.value)} className="w-full border p-2 rounded"><option value="keto">Keto</option><option value="normal">Normalna</option></select>
                    <p className="text-xs text-gray-500 mt-1">Cele są zapisywane oddzielnie dla każdego trybu diety.</p>
                  </div>
                  <div className="border-t pt-4 space-y-2">
                    <h4 className="font-semibold text-gray-700">Dane do BMR / TDEE</h4>
                    <div className="grid grid-cols-2 gap-2">
                      <label className="text-sm text-gray-600">Wiek<input type="number" value={profile.age} onChange={e=>setProfile({...profile,age:Number(e.target.value)})} className="w-full border p-2 rounded" /></label>
                      <label className="text-sm text-gray-600">Wzrost (cm)<input type="number" value={profile.height} onChange={e=>setProfile({...profile,height:Number(e.target.value)})} className="w-full border p-2 rounded" /></label>
                      <label className="text-sm text-gray-600">Masa (kg)<input type="number" step="0.1" value={profile.weight} onChange={e=>setProfile({...profile,weight:Number(e.target.value)})} className="w-full border p-2 rounded" /></label>
                      <label className="text-sm text-gray-600">Płeć<select value={profile.sex} onChange={e=>setProfile({...profile,sex:e.target.value})} className="w-full border p-2 rounded"><option value="male">Mężczyzna</option><option value="female">Kobieta</option></select></label>
                    </div>
                    <label className="block text-sm text-gray-600">Aktywność<select value={profile.activity} onChange={e=>setProfile({...profile,activity:Number(e.target.value)})} className="w-full border p-2 rounded"><option value="1.2">Siedzący tryb (1.2)</option><option value="1.375">Lekka aktywność (1.375)</option><option value="1.45">Umiarkowana aktywność (1.45)</option><option value="1.55">Aktywny (1.55)</option><option value="1.725">Bardzo aktywny (1.725)</option></select></label>
                    <div className="bg-blue-50 p-3 rounded text-sm"><div>BMR: <b>{bmr} kcal/dzień</b></div><div>TDEE: <b>{tdee} kcal/dzień</b></div><p className="text-xs text-gray-500 mt-1">Szacunki według wzoru Mifflin–St Jeor, nie pomiar kliniczny.</p></div>
                  </div>

                  <div className="space-y-3">
                    {Object.entries({calories: 'Kalorie (kcal)', protein: 'Białko (g)', fats: 'Tłuszcze (g)', carbs: 'Węglowodany (g)'}).map(([key, label]) => (
                      <div key={key}>
                        <label className="block text-sm text-gray-600">{label}</label>
                        <input type="number" value={goals[key]} onChange={e => { const next = { ...goals, [key]: Number(e.target.value) }; setGoals(next); setGoalsByDiet(prev => ({ ...prev, [dietMode]: next })); }} className="border p-2 rounded w-full"/>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t pt-4 space-y-3">
                  <h3 className="font-bold text-gray-700">Kopia zapasowa (Backup)</h3>
                  <div className="flex gap-2">
                    <button onClick={exportBackup} className="flex-1 bg-purple-600 text-white p-2 rounded text-sm font-bold">Eksportuj backup</button>
                    <label className="flex-1 bg-gray-200 text-gray-700 p-2 rounded text-sm font-bold text-center cursor-pointer">
                      Importuj backup
                      <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NutritionTracker />);
  </script>

  <style>
    html { min-height: 100%; background: #f9fafb; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea, button { font: inherit; }
    button, a, input, select { touch-action: manipulation; }
  </style>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.warn("Nie udało się uruchomić trybu offline:", error));
      });
    }
  </script>
</body>
</html>
